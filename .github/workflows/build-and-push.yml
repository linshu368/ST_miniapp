# =============================================================================
# ST_miniAPP — M5: build & push the 4 service images to GHCR (multi-arch).
#
# Images (namespace = ghcr.io/<owner>/st-miniapp-<component>):
#   - st-miniapp-frontend    ops/docker/Dockerfile.frontend   (context .)
#   - st-miniapp-backend     ops/docker/Dockerfile.backend    (context .)
#   - st-miniapp-st-backend  ops/docker/Dockerfile.st-bundle  (context .)
#   - st-miniapp-nginx       ops/nginx/Dockerfile             (context ops/nginx)
#
# Platforms: linux/amd64,linux/arm64 (arm64 wanted for native Apple-silicon dev).
# Auth: built-in GITHUB_TOKEN (no operator PAT required); needs packages: write,
#   which the permissions block below grants at workflow scope. Confirm the repo's
#   Settings -> Actions -> General -> Workflow permissions is NOT restricted to
#   read-only, otherwise the token cannot push packages.
#
# Tags per push (see docker/metadata-action below): at minimum
#   - sha-<short>            immutable, traceable to the exact commit
#   - <branch>-latest        moving pointer for the branch
# =============================================================================
name: Build and Push Images

on:
  push:
    branches:
      - dev
      - 'dev_stage5_*'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # One image's failure (e.g. arm64 native-addon issue) must not cancel the
      # others — we want to see which images are healthy and which are not.
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: .
            file: ops/docker/Dockerfile.frontend
            build_args: |
              NEXT_PUBLIC_API_URL=
          - name: backend
            context: .
            file: ops/docker/Dockerfile.backend
            build_args: ''
          - name: st-backend
            context: .
            file: ops/docker/Dockerfile.st-bundle
            build_args: ''
          - name: nginx
            context: ops/nginx
            file: ops/nginx/Dockerfile
            build_args: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU registers binfmt handlers so the amd64 runner can also build arm64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/st-miniapp-${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ github.ref_name }}-latest

      - name: Build and push (linux/amd64,linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          # Keep the manifest list to exactly the two requested platform manifests
          # (no provenance/sbom attestation entries) so `imagetools inspect` shows a
          # clean amd64 + arm64 pair.
          provenance: false
          sbom: false
          # Per-image GHA cache scope: first build is cold (multi-arch can take
          # 15-20 min), later builds reuse layers.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
