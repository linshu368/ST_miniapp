name: CI

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, ready_for_review, reopened]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_USE_MOCK_INIT_DATA: '0'
      DATABASE_ENV: test
      TEST_SUPABASE_PROJECT_REF: zoqelpfhurwehlvypryl
      PROD_SUPABASE_PROJECT_REF: wbtsfzozlmurljvglhpn
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SUPABASE_PROJECT_REF: zoqelpfhurwehlvypryl
      SUPABASE_URL: https://zoqelpfhurwehlvypryl.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @miniapp/backend exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Lint cross-package imports
        run: npx eslint --no-eslintrc -c .eslintrc.json 'packages/*/src/**/*.{ts,tsx}' --rule '{}' --ignore-pattern '**/__tests__/eslint-import-guard.ts' --no-inline-config

      - name: Build bridge-protocol
        run: pnpm --filter @miniapp/bridge-protocol build

      - name: Build st-extension
        run: pnpm --filter @miniapp/st-extension build

      - name: Test shared package
        run: pnpm --filter @miniapp/shared test

      - name: Test sync-engine package
        run: pnpm --filter @miniapp/sync-engine test

      - name: Build frontend
        run: pnpm --filter @miniapp/frontend build

  docker-build:
    name: Docker Build PR (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            file: ops/docker/Dockerfile.backend
          - name: st-backend
            context: .
            file: ops/docker/Dockerfile.st-bundle
          - name: nginx
            context: ops/nginx
            file: ops/nginx/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (amd64, no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
