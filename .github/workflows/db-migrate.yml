name: Database Migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: apply = 执行 SQL 并记账；inspect = 只读互证，不改库
        type: choice
        required: true
        default: apply
        options:
          - apply
          - inspect
      environment:
        description: Target database environment
        type: choice
        required: true
        default: test
        options:
          - test
          - production
      migration_file:
        description: SQL file under packages/shared/migrations（inspect 可留默认值）
        type: string
        required: true
        default: packages/shared/migrations/20260910_schema_migrations_ledger.sql
      confirm_production:
        description: Type RUN_PRODUCTION_MIGRATION when environment is production
        type: string
        required: false
        default: ''
      force_rerun:
        description: Re-apply even if the ledger says this file was already applied（checksum 必须仍一致）
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: db-migration-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    name: ${{ inputs.mode == 'inspect' && 'Inspect SQL migrations' || 'Apply SQL Migration' }}
    runs-on: ubuntu-latest

    env:
      TEST_PROJECT_REF: zoqelpfhurwehlvypryl
      PROD_PROJECT_REF: wbtsfzozlmurljvglhpn
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # supabase db query 走 prepared statement，多语句文件会报
      # "cannot insert multiple commands into a prepared statement"。
      # 迁移文件都是 BEGIN/DO/COMMIT 脚本，必须用 psql 按文件执行。
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Resolve target
        id: target
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ inputs.environment }}" == "production" ]]; then
            if [[ "${{ inputs.confirm_production }}" != "RUN_PRODUCTION_MIGRATION" ]]; then
              echo "Production connection requires confirm_production=RUN_PRODUCTION_MIGRATION" >&2
              exit 1
            fi
            project_ref="$PROD_PROJECT_REF"
            db_url="$PROD_DATABASE_URL"
          else
            project_ref="$TEST_PROJECT_REF"
            db_url="$TEST_DATABASE_URL"
          fi

          if [[ -z "$db_url" ]]; then
            echo "Missing GitHub secret for selected environment database URL" >&2
            exit 1
          fi

          if [[ "$db_url" != *"$project_ref"* ]]; then
            echo "Database URL does not contain expected project ref: $project_ref" >&2
            exit 1
          fi

          echo "::add-mask::$db_url"
          printf '%s' "$db_url" > "$RUNNER_TEMP/db_url"
          echo "project_ref=$project_ref" >> "$GITHUB_OUTPUT"

      - name: Inspect ledger
        if: ${{ inputs.mode == 'inspect' }}
        run: |
          set -euo pipefail
          DB_URL="$(<"$RUNNER_TEMP/db_url")"
          echo "::add-mask::$DB_URL"
          DATABASE_URL="$DB_URL" bash scripts/inspect-repo-migrations.sh | tee "$RUNNER_TEMP/inspect.md"
          {
            echo "### Database migration inspect"
            echo ""
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Project ref: \`${{ steps.target.outputs.project_ref }}\`"
            echo ""
            cat "$RUNNER_TEMP/inspect.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply migration
        if: ${{ inputs.mode == 'apply' }}
        id: apply
        env:
          MIGRATION_FILE: ${{ inputs.migration_file }}
          FORCE_RERUN: ${{ inputs.force_rerun }}
          APPLIED_BY: ${{ github.actor }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          if [[ "$MIGRATION_FILE" != packages/shared/migrations/*.sql ]]; then
            echo "migration_file must be under packages/shared/migrations and end with .sql" >&2
            exit 1
          fi
          if [[ "$MIGRATION_FILE" == *".."* ]]; then
            echo "migration_file must not contain path traversal" >&2
            exit 1
          fi
          if [[ ! -f "$MIGRATION_FILE" ]]; then
            echo "Migration file not found: $MIGRATION_FILE" >&2
            exit 1
          fi

          DB_URL="$(<"$RUNNER_TEMP/db_url")"
          echo "::add-mask::$DB_URL"
          DATABASE_URL="$DB_URL" \
            MIGRATION_FILE="$MIGRATION_FILE" \
            FORCE_RERUN="$FORCE_RERUN" \
            APPLIED_BY="$APPLIED_BY" \
            ENVIRONMENT="$ENVIRONMENT" \
            bash scripts/apply-repo-migration.sh

      - name: Cleanup database URL
        if: always()
        run: rm -f "$RUNNER_TEMP/db_url"

      - name: Migration summary
        if: ${{ inputs.mode == 'apply' && success() }}
        run: |
          {
            echo "### Database migration completed"
            echo ""
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Project ref: \`${{ steps.target.outputs.project_ref }}\`"
            echo "- Migration file: \`${{ inputs.migration_file }}\`"
            echo "- force_rerun: \`${{ inputs.force_rerun }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
