name: Docker Build

# 后端镜像没有编译步骤（运行时 tsx 直接跑 TS 源码），镜像构建只会被下列文件改坏：
# Dockerfile/dockerignore、依赖清单与 lockfile、Prisma schema（构建期 generate）。
# 只改业务源码时跳过，节省 Actions 分钟；漏判的后果是 Railway 构建失败、旧版本继续服务。
# Dockerfile 新增 COPY 来源或改动构建期输入时，同步更新这里的 paths。
on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - ops/docker/Dockerfile.backend
      - ops/docker/Dockerfile.backend.dockerignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/backend/package.json
      - packages/shared/package.json
      - packages/backend/prisma/**
      - .github/workflows/docker-build.yml

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Docker Build PR (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            file: ops/docker/Dockerfile.backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (amd64, no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
