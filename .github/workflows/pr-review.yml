# .github/workflows/pr-review.yml
name: PR Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    # hotfix 分支直接跳过，不触发审查
    if: ${{ !startsWith(github.head_ref, 'hotfix') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 判断 Prompt 类型
        id: prompt-type
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "当前分支: $BRANCH" >&2

          if [[ "$BRANCH" =~ ^pm ]]; then
            echo "type=frontend" >> $GITHUB_OUTPUT
            echo "✅ PM 分支 → frontend prompt" >&2
          elif [[ "$BRANCH" =~ ^dev ]]; then
            echo "type=backend" >> $GITHUB_OUTPUT
            echo "✅ dev 分支 → backend prompt" >&2
          else
            echo "❌ 未识别的分支前缀: $BRANCH" >&2
            echo "   规范的分支前缀: pm* | dev* | hotfix*" >&2
            exit 1
          fi

      - name: 生成审查报告
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          echo "=== 当前 HEAD ===" >&2
          git log --oneline -3 >&2
          echo "=== 本地分支 ===" >&2
          git branch -a >&2
          echo "==================" >&2

          git fetch origin main:main 2>/dev/null || true

          set +e
          bash ops/git/review.sh main ${{ steps.prompt-type.outputs.type }} > report.md 2>stderr.log
          EXIT_CODE=$?
          set -e

          echo "=== stderr 输出 ===" >&2
          cat stderr.log >&2
          echo "==================" >&2

          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ review.sh 退出码: $EXIT_CODE" >&2
            exit 1
          fi

          {
            echo 'report<<REPORT_EOF'
            cat report.md
            echo 'REPORT_EOF'
          } >> $GITHUB_OUTPUT

      - name: 发布报告到 PR 评论
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ai-review
          message: |
            ${{ steps.review.outputs.report }}

            ---
            *🤖 自动生成 · `${{ github.head_ref }}` → `main` · ${{ github.event.pull_request.head.sha }}*
