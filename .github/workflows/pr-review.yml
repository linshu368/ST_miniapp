# .github/workflows/pr-review.yml
name: PR Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    # hotfix 分支直接跳过，不触发审查
    if: ${{ !startsWith(github.head_ref, 'hotfix') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 判断 Prompt 类型
        id: prompt-type
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "当前分支: $BRANCH" >&2

          # 确保 main 分支可用
          git fetch origin main:main 2>/dev/null || true

          # ── 第零层：手动 override（优先级最高）──
          # 从 PR 描述和 commit messages 中检测 [review:backend] 或 [review:frontend]
          COMMIT_MESSAGES=$(git log main..HEAD --pretty=format:"%s %b" 2>/dev/null || echo "")
          ALL_TEXT="${PR_BODY} ${COMMIT_MESSAGES}"

          if echo "$ALL_TEXT" | grep -q '\[review:backend\]'; then
            echo "type=backend" >> $GITHUB_OUTPUT
            echo "✅ 手动 override [review:backend] → backend prompt" >&2
            exit 0
          fi

          if echo "$ALL_TEXT" | grep -q '\[review:frontend\]'; then
            echo "type=frontend" >> $GITHUB_OUTPUT
            echo "✅ 手动 override [review:frontend] → frontend prompt" >&2
            exit 0
          fi

          # ── 第一层：基于 diff 文件路径自动判定 ──
          CHANGED_FILES=$(git diff main...HEAD --name-only)

          echo "变更文件列表:" >&2
          echo "$CHANGED_FILES" >&2
          echo "---" >&2

          HAS_BACKEND=false
          HAS_FRONTEND=false

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            if [[ "$file" == packages/backend/* ]]; then
              HAS_BACKEND=true
            fi
            if [[ "$file" == packages/frontend/* ]]; then
              HAS_FRONTEND=true
            fi
          done <<< "$CHANGED_FILES"

          # 规则 1: 出现 backend 文件 → 后端 prompt
          if $HAS_BACKEND; then
            echo "type=backend" >> $GITHUB_OUTPUT
            echo "✅ 检测到 packages/backend/ 变更 → backend prompt" >&2
          # 规则 2: 无 backend，有 frontend → 前端 prompt
          elif $HAS_FRONTEND; then
            echo "type=frontend" >> $GITHUB_OUTPUT
            echo "✅ 检测到 packages/frontend/ 变更（无 backend）→ frontend prompt" >&2
          # 规则 3: 仅 shared / 根配置 → 后端 prompt
          else
            echo "type=backend" >> $GITHUB_OUTPUT
            echo "✅ 仅 shared/根目录配置变更 → backend prompt" >&2
          fi

      - name: 生成审查报告
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          echo "=== 当前 HEAD ===" >&2
          git log --oneline -3 >&2
          echo "=== 本地分支 ===" >&2
          git branch -a >&2
          echo "==================" >&2

          git fetch origin main:main 2>/dev/null || true

          set +e
          bash ops/git/review.sh main ${{ steps.prompt-type.outputs.type }} > report.md 2>stderr.log
          EXIT_CODE=$?
          set -e

          echo "=== stderr 输出 ===" >&2
          cat stderr.log >&2
          echo "==================" >&2

          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ review.sh 退出码: $EXIT_CODE" >&2
            exit 1
          fi

          {
            echo 'report<<REPORT_EOF'
            cat report.md
            echo 'REPORT_EOF'
          } >> $GITHUB_OUTPUT

      - name: 发布报告到 PR 评论
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ai-review
          message: |
            ${{ steps.review.outputs.report }}

            ---
            *🤖 自动生成 · `${{ github.head_ref }}` → `main` · ${{ github.event.pull_request.head.sha }}*