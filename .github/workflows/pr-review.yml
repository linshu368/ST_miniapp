# .github/workflows/pr-review.yml
name: PR Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    # opened = PR 刚创建时
    # synchronize = PR 分支有新 push 时（PM 改了代码重新 push）

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 判断 Prompt 类型
        id: prompt-type
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ "$BRANCH" == pm/* ]]; then
            echo "type=frontend" >> $GITHUB_OUTPUT
          else
            echo "type=backend" >> $GITHUB_OUTPUT
          fi

      - name: 生成审查报告
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          # 先确认 git 状态
          echo "=== 当前 HEAD ===" >&2
          git log --oneline -3 >&2
          echo "=== 本地分支 ===" >&2
          git branch -a >&2
          echo "==================" >&2

          # 确保 main 分支可用（GitHub Actions checkout 可能只拉了 PR 的 ref）
          git fetch origin main:main 2>/dev/null || true

          # 运行 review，捕获退出码而不是直接退出
          set +e
          bash ops/git/review.sh main ${{ steps.prompt-type.outputs.type }} > report.md 2>stderr.log
          EXIT_CODE=$?
          set -e

          # 无论成功失败都打印 stderr
          echo "=== stderr 输出 ===" >&2
          cat stderr.log >&2
          echo "==================" >&2

          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ review.sh 退出码: $EXIT_CODE" >&2
            exit 1
          fi

          {
            echo 'report<<REPORT_EOF'
            cat report.md
            echo 'REPORT_EOF'
          } >> $GITHUB_OUTPUT

      - name: 发布报告到 PR 评论
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ai-review
          message: |
            ${{ steps.review.outputs.report }}

            ---
            *🤖 自动生成 · `${{ github.head_ref }}` → `main` · ${{ github.event.pull_request.head.sha }}*