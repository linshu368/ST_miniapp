# .github/workflows/pr-review.yml
name: PR Review

on:
  pull_request_target:
    branches: [main, dev]
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  pull-requests: write
  contents: read
  actions: write

jobs:
  review:
    runs-on: ubuntu-latest
    # hotfix 分支直接跳过；dev→main 的晋升 PR 也跳过（代码已在合入 dev 时审过）
    if: ${{ !startsWith(github.event.pull_request.head.ref, 'hotfix') && github.event.pull_request.head.ref != 'dev' }}

    steps:
      - name: Checkout trusted review tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0

      - name: Checkout PR code as data
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-worktree
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成审查报告
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          REVIEW_PROMPT_SOURCE: feishu
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_DOCUMENT_ID: ${{ secrets.FEISHU_DOCUMENT_ID }}
          BASE_REF: ${{ github.base_ref }}
          REVIEW_ARTIFACT_DIR: review-artifacts
          REVIEW_REPO_ROOT: pr-worktree
        run: |
          echo "=== 当前 HEAD ===" >&2
          git -C "$REVIEW_REPO_ROOT" log --oneline -3 >&2
          echo "=== 审查基准: $BASE_REF ===" >&2
          echo "==================" >&2

          git -C "$REVIEW_REPO_ROOT" remote add base "https://github.com/${{ github.repository }}.git" 2>/dev/null || true
          git -C "$REVIEW_REPO_ROOT" fetch --no-tags base "$BASE_REF:$BASE_REF" 2>/dev/null \
            || git -C "$REVIEW_REPO_ROOT" fetch --no-tags origin "$BASE_REF:$BASE_REF" 2>/dev/null \
            || true

          set +e
          bash ops/git/review.sh "$BASE_REF" > report.md 2>stderr.log
          EXIT_CODE=$?
          set -e

          echo "=== stderr 输出 ===" >&2
          cat stderr.log >&2
          echo "==================" >&2

          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ review.sh 退出码: $EXIT_CODE" >&2
            exit 1
          fi

          {
            echo 'report<<REPORT_EOF'
            cat report.md
            echo 'REPORT_EOF'
          } >> $GITHUB_OUTPUT

      - name: 上传 LLM 输入 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-input-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: review-artifacts/
          retention-days: 30
          if-no-files-found: ignore

      - name: 准备评论元信息
        id: comment-meta
        run: |
          echo "header=ai-review-full" >> $GITHUB_OUTPUT
          echo "badge=📋 **PR 代码审查**（基准: \`${{ github.base_ref }}\`）" >> $GITHUB_OUTPUT

      - name: 发布报告到 PR 评论
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ${{ steps.comment-meta.outputs.header }}
          message: |
            ${{ steps.comment-meta.outputs.badge }}

            ${{ steps.review.outputs.report }}

            ---

            *🤖 自动生成 · `${{ github.head_ref }}` → `${{ github.base_ref }}` · ${{ github.event.pull_request.head.sha }}*
