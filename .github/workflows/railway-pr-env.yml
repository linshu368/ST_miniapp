# Create / delete a Railway backend named pr-{number} for each feature PR.
# Domain convention (verified): https://stminiapp-pr-{number}.up.railway.app
# Duplicates Railway `development` only — never production.
name: Railway PR environment

on:
  pull_request:
    branches: [dev]
    types: [opened, reopened, synchronize, closed, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: railway-pr-env-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
  RAILWAY_PROJECT_ID: ce38c0c0-88cd-407a-9c04-06124cd42e97
  RAILWAY_WORKSPACE_ID: 2af5f2b0-e86e-4099-81d0-c2fc8af50c35
  RAILWAY_DEVELOPMENT_ENV_ID: a184d734-11e3-4b20-a114-1868f4c5f4d3
  RAILWAY_SERVICE: stminiapp
  RAILWAY_PAYMENT_CRON_SERVICE_ID: 4be1ca31-21fb-4c2d-9a44-aec7335a7471
  PAYMENT_CRON_START_COMMAND: ./node_modules/.bin/tsx src/scripts/expire-payment-orders.ts

jobs:
  upsert:
    name: Ensure pr-${{ github.event.pull_request.number }}
    if: github.event.action != 'closed' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Link project
        run: |
          railway link \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_DEVELOPMENT_ENV_ID" \
            --workspace "$RAILWAY_WORKSPACE_ID" \
            --json

      - name: Create environment if missing
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          export ENV_NAME="pr-${PR_NUMBER}"
          BACKEND_URL="https://stminiapp-pr-${PR_NUMBER}.up.railway.app"

          if railway environment list --json | python3 -c "
          import json, os, sys
          name = os.environ['ENV_NAME']
          envs = json.load(sys.stdin).get('environments') or []
          sys.exit(0 if any(e.get('name') == name for e in envs) else 1)
          "; then
            echo "Railway environment ${ENV_NAME} already exists"
          else
            railway environment new "$ENV_NAME" \
              --duplicate "$RAILWAY_DEVELOPMENT_ENV_ID" \
              --service-config "$RAILWAY_SERVICE" source.branch "$HEAD_REF" \
              --service-config "$RAILWAY_SERVICE" variables.PORT.value "8080" \
              --service-config "$RAILWAY_SERVICE" variables.SENTRY_ENVIRONMENT.value "preview" \
              --service-config "$RAILWAY_SERVICE" variables.PAYMENT_NOTIFY_URL.value "${BACKEND_URL}/api/payment/webhook/zqpay" \
              --service-config "$RAILWAY_SERVICE" variables.PAYMENT_RETURN_URL.value "${BACKEND_URL}/api/payment/return" \
              --service-config "$RAILWAY_PAYMENT_CRON_SERVICE_ID" deploy.startCommand "$PAYMENT_CRON_START_COMMAND" \
              --json
          fi

          # PR 环境可能在 development 修复前已经复制出来；每次 upsert 都校准一次，
          # 同时避免未来因源环境快照漂移再次使用镜像中不存在的全局 tsx。
          ENV_ID="$(railway environment list --json | python3 -c "
          import json, os, sys
          name = os.environ['ENV_NAME']
          envs = json.load(sys.stdin).get('environments') or []
          print(next(e['id'] for e in envs if e.get('name') == name))
          ")"
          CURRENT_PAYMENT_CRON_START_COMMAND="$(railway api \
            'query($serviceId:String!,$environmentId:String!){serviceInstance(serviceId:$serviceId,environmentId:$environmentId){startCommand}}' \
            --raw-var serviceId="$RAILWAY_PAYMENT_CRON_SERVICE_ID" \
            --raw-var environmentId="$ENV_ID" \
            --compact | python3 -c "
          import json, sys
          print(json.load(sys.stdin)['data']['serviceInstance'].get('startCommand') or '')
          ")"
          if [ "$CURRENT_PAYMENT_CRON_START_COMMAND" = "$PAYMENT_CRON_START_COMMAND" ]; then
            echo "PR environment payment cron command is already aligned"
          else
            railway api \
              'mutation($serviceId:String!,$environmentId:String!,$startCommand:String!){serviceInstanceUpdate(serviceId:$serviceId,environmentId:$environmentId,input:{startCommand:$startCommand})}' \
              --raw-var serviceId="$RAILWAY_PAYMENT_CRON_SERVICE_ID" \
              --raw-var environmentId="$ENV_ID" \
              --raw-var startCommand="$PAYMENT_CRON_START_COMMAND"
            railway api \
              'mutation($serviceId:String!,$environmentId:String!){serviceInstanceDeployV2(serviceId:$serviceId,environmentId:$environmentId)}' \
              --raw-var serviceId="$RAILWAY_PAYMENT_CRON_SERVICE_ID" \
              --raw-var environmentId="$ENV_ID"
          fi

          # PR 环境与 development 共用 TEST 数据库，不能复制到期提醒调度器；否则每个
          # 活跃 PR 都会重复扫描。数据库幂等只是兜底，调度拓扑仍保持单实例。
          if railway service list --environment "$ENV_NAME" --json | python3 -c "
          import json, sys
          services = json.load(sys.stdin)
          sys.exit(0 if any(s.get('name') == 'stminiapp-vip-reminder-cron' for s in services) else 1)
          "; then
            railway service delete \
              --service stminiapp-vip-reminder-cron \
              --environment "$ENV_NAME" \
              --yes \
              --json
          else
            echo "PR environment has no VIP reminder cron"
          fi

      - name: Comment backend URL
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          BACKEND_URL="https://stminiapp-pr-${PR_NUMBER}.up.railway.app"
          if gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --jq '.[].body' \
            | grep -Fq "$BACKEND_URL"; then
            echo "PR already has backend URL comment"
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body "$(cat <<EOF
          Railway preview backend: ${BACKEND_URL}

          Vercel Preview will call this URL (env \`pr-${PR_NUMBER}\`, copied from \`development\`).
          EOF
          )"

  teardown:
    name: Delete pr-${{ github.event.pull_request.number }}
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Link project
        run: |
          railway link \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_DEVELOPMENT_ENV_ID" \
            --workspace "$RAILWAY_WORKSPACE_ID" \
            --json

      - name: Delete environment
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          ENV_NAME="pr-${PR_NUMBER}"
          railway environment delete "$ENV_NAME" --yes --json || true
