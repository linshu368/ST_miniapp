# =============================================================================
# ST_miniAPP — local/staging orchestration.
#
# Topology (single bridge network app-net; 网关收敛后两个服务各自映到 host 端口):
#
#   浏览器 ──> host:3000  frontend  (Next.js standalone)
#          └─> host:3001  backend   (Fastify platform API)
#
# nginx 单域名网关随网关收敛退场（取回见 commit c737294 及其之前的历史）：ST 退场后它
# 已无分发对象，前端改为直连 backend，跨域由 backend 的 FRONTEND_URL（CORS）放行。
# ST / st-bundle 的代码与镜像定义同样已删除，本地 compose 不再起 SillyTavern。
#
# Secrets: every service reads .env.compose (cp .env.compose.example .env.compose).
# Only placeholders ship in the repo; real values are operator-supplied.
# =============================================================================

services:
  # Fastify platform API. 直接映到 host:3001（浏览器与前端容器都从这里调）。
  backend:
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.backend
    image: st-miniapp/backend:m4
    env_file: .env.compose
    ports:
      - '3001:3001'
    networks:
      - app-net
    restart: unless-stopped

  # Next.js standalone runtime.
  # ⚠️ 仅本地全栈仿真使用：生产前端部署在 Vercel（方案 Y，对外域名绑 Vercel），
  #    Railway 不部署此镜像。此服务只为离线复现整套 MVP 流程而存在。
  frontend:
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.frontend
      args:
        # Baked into the client bundle at build time. 没有网关做同源代理了，必须是
        # 浏览器能直达的 backend 地址；改值要重新 build 前端镜像才生效。
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    image: st-miniapp/frontend:m4
    env_file: .env.compose
    ports:
      - '3000:3000'
    # The shared env_file carries PORT=3001 (backend's port); re-assert 3000 here so the
    # Next standalone server (reads $PORT) listens where the healthcheck expects it.
    # `environment` takes precedence over `env_file`.
    environment:
      PORT: '3000'
      HOSTNAME: 0.0.0.0
    networks:
      - app-net
    restart: unless-stopped

networks:
  app-net:
    driver: bridge
