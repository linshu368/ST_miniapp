    owner: backend/src/features/image-plaza/video-repository.ts
    status: moving
    phase: 6
    note: 视频生成的报价（M）。用户 11-19：视频生成计费并入 billing.usage_charges（6b-4 直接做，不再等视频广场负责人对齐）；迁移前不新增逻辑列
  media_plaza.video_attempts:
    nature: E
    owner: rpc:billing.reserve_media_plaza_video
    status: moving
    phase: 6
    note: 混合 J/M：钱字段与租约在 6b-4 拆（钱 → billing.usage_charges，用户 11-19 定直接做）；新交付租约进入 video_delivery_jobs；迁移前不新增逻辑列
  media_plaza.video_artifacts:
    nature: E
    owner: rpc:media_plaza.publish_video_artifact
    status: active
    note: Stream UID/稳定链接与产物同生命周期；封面在Supabase；duration_ms为媒体内容时长非测速；生产base/Stream候选未执行
  media_plaza.video_delivery_jobs:
    nature: J
    owner: backend/src/features/image-plaza/video-delivery-repository.ts
    status: planned
    note: 唯一attempt交付、TUS会话/源hash/租约/退避；终态保留7天，未知保留至对账；service_role，禁止前端读取

  media_plaza.image_plaza_attempts:
    nature: E
    owner: backend/src/features/image-plaza
    status: moving
    move:
      - {
          to: media_plaza.image_plaza_jobs,
          cols: [lease_owner, lease_expires_at, provider_request_id],
