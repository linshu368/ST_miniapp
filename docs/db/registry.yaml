    { nature: J, owner: backend/src/features/image-plaza, status: planned, phase: 4 }
  media_plaza.image_plaza_conversations:
    { nature: E, owner: backend/src/features/image-plaza, status: active }
  media_plaza.image_plaza_messages:
    {
      nature: E,
      owner: backend/src/features/image-plaza,
      status: active,
      note: content 共享存储上限5000的前向迁移为本地候选，视频请求5000/图片请求2000；不改权限与历史正文,
    }
  media_plaza.image_plaza_artifacts:
    { nature: E, owner: backend/src/features/image-plaza, status: active }
  media_plaza.image_plaza_reference_assets:
    { nature: E, owner: backend/src/features/image-plaza, status: active }
  media_plaza.image_plaza_works:
    {
      nature: E,
      owner: backend/src/features/image-plaza,
      status: active,
      note: like_count 为 D 列，只由 image_plaza_likes 决定,
    }
  media_plaza.image_plaza_likes:
    { nature: S, owner: backend/src/features/image-plaza, status: active }
  media_plaza.image_plaza_feed_scores:
    {
      nature: D,
      owner: backend/src/features/image-plaza,
      status: planned,
      note: 可重建的图片视频模型均衡排名；仅内部RPC读取，旧works.initial_feed_order保留兼容；20261118_media_plaza_feed_ranking尚未远端执行,
    }

  # ───────────────────────── billing ─────────────────────────
  billing.payment_orders:
    nature: M
    owner: backend/src/infrastructure/repositories/MiniappPaymentOrderRepository.ts（入账只走 PaymentSettlement.settlePaidOrder）
    status: active
    note: 4a 起只留订单与履约事实：对账调度在 payment_reconcile_jobs；结账确认只记 ops.payment_events 的 checkout_confirmation 事件（原 3 列无读者，收缩步删）

  billing.payment_reconcile_jobs:
    nature: J
    owner: rpc:billing.claim_payment_reconcile_jobs + billing.record_payment_reconcile_unpaid（PaymentReconciliation.ts 调用）
    status: active
    reads: [ops.payment_events（20261119 停查策略迁移仅一次有界回填，非产品路径）]
    note: 每张可对账订单一行；领取时清掉已入账/已终结/创建超过 8 小时的任务，30s·2^n 退避封顶 2 小时。到期后有效 unpaid 累计 3 次停查；unpaid_confirmations 与 last_unpaid_claim_at 按领取时间 CAS 去重，停查行保留至超龄/入账清理。20261119 migration 待执行，不代表线上已生效

  billing.usage_charges:
    nature: M
    owner: 文本：rpc:billing.charge_llm_usage / reconcile_llm_usage / refund_llm_usage_charge（扣费）、billing.record_chat_turn_charge / save_chat_turn_quote（轮次结算结果与报价），开轮与交付函数写报价快照；语音 / 广场计费尚未并入
    status: active
    phase: 6
    reservation: 20261123候选reserved_main_credits/reserved_bonus_credits；开轮原子预留，终账/明确失败归零。余额不足永久failed且实扣0，不因充值重开。
    from: llm_usage_charges + chat_history 计费列 + chat_message_audio 计费列 + image_plaza_attempts 计费列 + image_plaza_quotes + video_quotes
    note: 一次可计费动作一行（id = charge_id，永久保留），生命周期 quoted → reserved → charged / free / failed / waived / refunded，文本另有旧状态 pending / partial / reconciled / historical 原样迁入；业务表只存 charge_id。文本（kind=chat_text）6b-1a 回填全部历史，6b-1c 起各写入点直写，旧扣费表、去重表与镜像触发器已删（11-23）。超过补结算窗口（24 小时）还停在 quoted 的报价视为没收到钱（收缩时一次性收口为 waived / failed，之后新出现的按此口径读）
    keys:
      {
        quote:
          [
            snapshot（开轮冻结报价，原 chat_history.llm_billing_snapshot）,
            charge（扣费明细：型号、目录与定价版本、汇率、加价、初始额、计算额、兜底、元数据、对账时间）,
