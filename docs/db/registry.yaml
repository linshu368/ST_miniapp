# runtime_config key 清理（阶段 1 逐个复核后执行）
runtime_config_keys:
  # drop_candidates 已于 20261117_db_reorg_managed_config_keys.sql 处理：7 个托管 key 退役、
  # 另 5 个零引用 key（ai_config_source / interaction_mode_blocks / llm_model_tiers /
  # miniapp_chat_message_credit_cost / miniapp_model_tier_credit_costs）的行已删除。
  merge_into_object:
    - {
        into: voice_config,
        keys:
          [
            voice_billing_enabled,
            voice_generation_credits,
            voice_max_spoken_chars,
            voice_price_label,
            voice_draft_failed_hint,
            voice_over_limit_hint,
            voice_tts_failed_hint,
          ],
      }
    - {
        into: chat_image_config,
        keys:
          [
            image_generation_enabled,
            image_generation_credits,
            image_width,
            image_height,
            image_max_output_bytes,
            image_max_prompt_chars,
            image_price_label,
            image_prompt_policy,
            image_default_art_style,
            image_description_system_prompt,
            image_text_model_config,
            image_description_failed_hint,
            image_failed_unknown_hint,
            image_generation_failed_hint,
            image_prompt_over_limit_hint,
          ],
      }
    - {
        into: image_plaza_config,
        keys:
          [
            image_plaza_enabled,
            image_plaza_model_catalog,
            image_plaza_share_rebate_rate,
            image_plaza_share_tip,
            image_plaza_tags,
          ],
      }
    - {
        into: community_config,
        keys:
          [
            miniapp_official_community_enabled,
            miniapp_official_community_chat_id,
            miniapp_official_community_url,
            miniapp_official_community_fallback_handle,
            miniapp_official_community_copy,
            miniapp_official_community_reward_credits,
            miniapp_official_community_reward_started_at,
          ],
      }
    - {
        into: invite_config,
        keys:
          [miniapp_invite_entry_enabled, miniapp_invite_center_config, miniapp_invite_reward_rules],
      }
    - {
        into: checkin_config,
        keys:
          [
            miniapp_checkin_new_user_credits,
            miniapp_checkin_veteran_credits,
            vip_checkin_bonus_config,
          ],
      }
    - {
        into: vip_config,
        keys:
          [vip_plans_config, vip_purchase_enabled, vip_reminders_enabled, vip_text_discount_rate],
      }
    - { into: feature_free_trial_limits, keys: [media_feature_free_trial_limit] }
