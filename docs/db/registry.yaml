# 数据库登记表：每张表"现在是什么 + 要去哪里"。规则见 CONTRACT.md。
#
# 字段：
#   nature   E 实体 / S 状态 / M 钱 / J 任务 / O 观测 / C 配置 / D 派生（CONTRACT §1.2）
#   owner    权威写入模块（packages/ 下路径；RPC 写入写 "rpc:<schema>.<fn>"）
#   status   active | frozen | moving | planned | drop | external（CONTRACT §8）
#   phase    迁移阶段号，见 .trellis/tasks/11-17-db-reorg/design.md
#   keep     宽表最终保留的列（只在 moving 表列出）
#   move     [{to: 目标表, cols: [...], phase: N}]
#   drop_cols [{cols: [...], phase: N}]
#   from     计划表的来源列
#   keys     jsonb 列允许的键（契约的一部分，加键要改这里）
#   billing_input  该表的 *_ms / 测速列被计费或交付判定读取，不属于 O
#   reads    后台任务读 ops / 其他域做聚合的登记
#   renamed_from  改名前的名字（schema 写在 schemas 下，表只写表名）；契约检查把历史迁移里的旧名字认作同一条目
#   note     一句话说明
#
# 采集依据：2026-11-17 生产库结构（wbtsfzozlmurljvglhpn，只读结构，未读业务行）+ origin/dev 92d05b27 代码引用。

version: 1

schemas:
  app_core: { status: active, purpose: 用户身份与资料、偏好、角色卡、全局运行配置 }
  experience: { status: active, purpose: 对话内容、交付状态、语音与附图产物、长期记忆 }
  media_plaza: { status: active, purpose: 图片广场 }
  billing: { status: active, purpose: 钱 }
  features:
    {
      status: active,
      purpose: 随功能上下线的产品状态,
      renamed_from: miniapp_features,
      note: 20261123_db_reorg_p7a_naming.sql 改名；旧名兼容层到收缩步删除,
    }
  traffic:
    {
      status: active,
      purpose: 渠道、入口、邀请、用户归因,
      renamed_from: miniapp_traffic,
      note: 20261123_db_reorg_p7a_naming.sql 改名；旧名兼容层到收缩步删除,
    }
  admin: { status: active, purpose: 运营平台过程 }
  analytics:
    {
      status: active,
      purpose: 看数视图与离线汇总；Grafana/指标读者唯一入口,
      renamed_from: miniapp_analytics,
      note: 20261123_db_reorg_p7a_naming.sql 改名；旧名兼容层到收缩步删除,
    }
  ops:
    {
      status: active,
      purpose: 工程观测（上游调用明细、测速、事件、告警）,
      note: 20261117_db_reorg_ops_cs_feed.sql 建立；只给 service_role,
    }
  cs_feed:
    {
      status: active,
      purpose: 给客服仓库读的只读视图,
      note: 20261117_db_reorg_ops_cs_feed.sql 建立；授权 cs_runtime_v1 / cs_persona_reader,
    }
  cs: { status: external, note: 客服仓库 linshu368/ST_cs_platform 拥有 }
  drama_archive: { status: external, note: 上传端拥有；本仓库只拥有 drama_likes / drama_comments }
  public:
    {
      status: active,
      note: 只放 Supabase 平台对象，不放业务对象（旧 bot 残留函数已于 20261117_db_reorg_cleanup.sql 删除）,
    }

tables:
  # ───────────────────────── app_core ─────────────────────────
  app_core.users:
    nature: E
    owner: backend/src/lib/user.ts（身份）+ backend/src/infrastructure/repositories/UserProfileRepository.ts（资料）
    status: active
    keep:
      [
        id,
        tg_id,
        tg_username,
        tg_first_name,
        tg_last_name,
        tg_avatar_url,
        display_name,
        custom_avatar_url,
        created_at,
        updated_at,
      ]
    note: 身份 + 资料。建号只走 app_core.ensure_user；TG 资料只经 app_core.refresh_user_profile（值没变不写）。归因在 traffic.user_attributions、轮数在 experience.user_chat_stats（3a），资料 3b-2 从 miniapp_user_settings 迁入

  app_core.miniapp_user_settings:
    nature: S
    owner: backend/src/infrastructure/repositories/MiniappUserSettingsRepository.ts
    status: drop
    note: 已改名 app_core.user_preferences（3b-2，资料列迁到 users、avatar_url 已删），原名对象已不存在；条目只为历史迁移（20261117_drive_mode.sql）的契约检查保留

  app_core.user_preferences:
    nature: S
    owner: backend/src/infrastructure/repositories/MiniappUserSettingsRepository.ts
    status: active
    keep:
      [
        user_id,
        selected_model_id,
        pref_word_count,
        pref_show_options,
        pref_custom_instructions,
        pref_show_status,
        pref_show_memory,
        pref_reply_styles,
        pref_drive_mode,
        pref_voice_id,
        pref_voice_playback_rate,
        created_at,
        updated_at,
      ]
    note: 用户级生成与语音偏好（每用户一行，无行=全部默认）。由 miniapp_user_settings 改名（3b-2）；回复风格、三个指令槽开关只经各自 RPC 原子更新

  app_core.user_personas:
    nature: E
    owner: backend/src/infrastructure/repositories/UserPersonaRepository.ts
    status: active
    note: 用户的主角人设库（每人最多 10 个，至多一个默认）。写只经 rpc:app_core.save_user_persona / delete_user_persona；描述原样进 prompt，名字只给用户区分（20261118_character_persona.sql）

  app_core.user_character_preferences:
    nature: S
    owner: backend/src/infrastructure/repositories/UserPersonaRepository.ts
    status: active
    note: 用户 × 角色卡：补充设定（≤1000 字）+ 人设选择（persona_id / persona_disabled 互斥，无行或都空 = 跟随默认）+ 玩家改过的状态栏 status_bar_detail（NULL = 用卡自带，20261119_status_bar_v2.sql）+ 玩家对记忆栏的要求 memory_request（≤300 字，NULL = 没写；只经 MemoryBarRepository 写这一列，20261123_memory_panel.sql）。生成链路经 rpc:app_core.get_character_prompt_settings 读取

  app_core.characters:
    nature: E
    owner: backend/src/infrastructure/repositories/CharacterCardRepository.ts
    status: active
    keep:
      [
        id,
        name,
        description,
        avatar_url,
        creator_notes,
        alternate_greetings,
        character_book,
        character_version,
        creator,
        extensions,
        first_mes,
        mes_example,
        personality,
        post_history_instructions,
        scenario,
        spec,
        spec_version,
        system_prompt,
        tags,
        raw_card,
        card_hash,
        character_persona_and_style,
        status_bar_detail,
        is_test,
        created_at,
        updated_at,
      ]
    note: 只存卡内容（上架状态在 character_listings，3c 拆出）。status_bar_detail = 卡上的状态栏：创作卡发布/审核通过时写入，运营给存量卡批量写入走 rpc:app_core.set_character_status_bar（20261119_status_bar_v2.sql）。官方卡读本表内容列、创作卡读 character_versions，同一事实两条路径；是否统一为"内容全进版本表"另行评估（design.md 候选项）

  app_core.character_listings:
    nature: S
    owner: rpc:admin.publish_character_layout_draft（运营布局发布）
    status: active
    keep: [character_id, enabled, sort_order, archived_at, last_listed_at, updated_at]
    note: 每卡一行，插卡触发器建行（下架、排序 0）。其余写入方：admin.create_character、app_core.mutate_creator_character / review_creator_character、官方卡导入脚本。last_listed_at 只在由未上架转为上架时刷新（触发器）；测试卡不能上架（触发器）。后端只读（Prisma 关系 Character.listing）

  app_core.character_versions:
    {
      nature: E,
      owner: backend/src/features/creator,
      status: active,
      note: 不可变卡内容版本；会话按版本绑定；runtime.status_bar 为作者的状态栏（shared StatusBarTemplate，可缺省）,
    }
  app_core.character_cover_assets:
    { nature: E, owner: backend/src/features/creator, status: active }
  app_core.character_creations:
    {
      nature: S,
      owner: backend/src/features/creator,
      status: active,
      note: 作者草稿与审核状态；发布 CAS 同事务写 characters/versions，故留在 app_core。deleted_at = 作者删除（同事务转私密，已有使用权的玩家照用；后端从作者列表过滤；20261124_creator_character_delete.sql）,
    }
  app_core.character_access_grants:
    { nature: S, owner: backend/src/features/creator, status: active }

  app_core.runtime_config:
    nature: C
    owner: backend/src/platform/runtime-config.ts（读）；admin 发布 RPC（写）
    status: active
    note: key 规则见 CONTRACT §3.4；待清理 key 见下方 runtime_config_keys

    keys:
      llm_relay_provider_config: [packy, onexmodel]
    relay_policy_fields:
      [
        quota_per_unit,
        cny_per_unit,
        usd_per_cny,
        conversion_version,
        conversion_source,
        monitor_enabled,
        low_balance_quota,
      ]

  app_core.text_postprocess_versions:
    { nature: C, owner: backend/src/features/text-postprocess, status: active }

  # ───────────────────────── experience ─────────────────────────
  experience.chat_sessions:
    nature: E
    owner: backend/src/infrastructure/repositories/ChatSessionRepository.ts
    status: active
    note: message_count / last_message_at / last_message_preview 为 D 列，由触发器维护；branch_* 为分叉时一次写入

  experience.chat_history:
    nature: E
    owner: backend/src/infrastructure/repositories/ConversationHistoryRepository.ts（CI legacy guard 唯一读写入口）
    status: active
    keep:
      [
        id,
        user_id,
        session_id,
        character_id,
        turn_index,
        revision,
        model,
        user_input,
        assistant_reply,
        status,
        llm_finish_reason,
        created_at,
        postprocess_version,
        choice_rules_mode,
        drive_mode,
        rich_reply_metadata,
        llm_charge_id,
      ]
    keys:
      rich_reply_metadata:
        [展示用富回复元数据（rich_reply_mode / rich_reply_result / rich_reply_issues）]
    note: 计费只存 llm_charge_id（指向 billing.usage_charges）。6b-1c 收缩（20261123_db_reorg_p6b1c_turn_billing_contract.sql）已删 deduction_rate / llm_intended_deduction / llm_billing_snapshot / llm_billing_settled_at，每轮星尘经展示视图读 usage_charges.charged_credits

