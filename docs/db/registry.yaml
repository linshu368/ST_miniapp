    owner: backend/src/infrastructure/repositories/GenerationObservationRepository.ts
    status: active
    billing_input: true
    note: 名字像观测，实为交付状态与计费依据（billing.chat_delivery_billing_gate、experience.report_chat_first_token、cancel_chat_generation 读取）
    keep:
      [
        chat_history_id,
        client_request_id,
        mode,
        request_received_at,
        requested_model_id,
        requested_provider,
        requested_provider_model_id,
        catalog_version,
        primary_timeout_ms,
        timeout_rate_target,
        fallback_model_id,
        fallback_timeout_ms,
        fallback_triggered_ms,
        first_token_deadline_ms,
        delivery_attempt_id,
        requires_visible_token,
        user_stop_billing_enabled,
        recoverable_delivery,
        first_token_timeout,
        server_timeout_stage,
        server_first_token_ready_ms,
        first_token_preview,
        billing_rejected,
        client_outcome,
        client_reason,
        client_delivery_failed,
        client_first_token_visible_ms,
        measurement_method,
        created_at,
      ]
  experience.chat_generation_attempts:
    nature: S
    owner: backend/src/infrastructure/repositories/GenerationObservationRepository.ts
    status: active
    note: 上游调用身份（交付仲裁与结算要用）+ 畅聊模型评估读的三个耗时。6a-2a 删 7 个无读者列，6a-2c-3 落败片段只在 ops.llm_calls.discarded_detail、discarded_response 已删
    billing_input: true
  experience.chat_message_audio:
    nature: E
    owner: backend/src/infrastructure/repositories/ChatMessageAudioRepository.ts
    status: moving
    keep:
      [
        id,
        message_id,
        session_id,
        user_id,
        revision,
        is_active,
        status,
        voice_id,
        tts_model,
        tts_speed,
        source_chars,
        spoken_chars,
        spoken_text,
        storage_path,
        audio_url,
        duration_ms,
        error_code,
        created_at,
        updated_at,
      ]
    move:
      - {
          to: billing.usage_charges,
          cols:
            [
              credits_charged,
              debit_ledger_id,
              charged_at,
              billing_mode,
              free_trial_ordinal,
              price_credits,
              price_label,
              original_price_credits,
              vip_discount_rate,
              vip_discounted_exact,
              vip_valid_until,
              vip_discount_config_version,
            ],
          phase: 6,
          note: 本表改存 charge_id,
        }

  experience.chat_message_images:
    nature: E
    owner: 无（只读归档）
    status: frozen
    note: 聊天配图 9-29 关闭、11-19 下线（用户确认）。写入与读取代码、任务函数、扣费函数 billing.settle_image_generation、15 个配置 key 均已删除；274 行保留归档、收回 API 角色权限，扣费以 billing.wallet_ledger 为准，图片文件在存储桶 miniapp-chat-images。原计划拆出的 chat_image_jobs 与 6b-3 不再做
  experience.user_chat_stats:
    {
      nature: D,
      owner: rpc:experience.increment_user_total_round,
      status: active,
      note: 无行=0；读用 experience.user_total_round,
    }

  experience.chat_branch_turns:
    { nature: S, owner: rpc:experience.fork_chat_session, status: active }
  experience.chat_folders:
    {
      nature: E,
      owner: backend/src/infrastructure/repositories/ChatFolderRepository.ts,
      status: active,
    }
  experience.chat_history_display_metadata:
    {
      nature: E,
      owner: rpc:experience.begin_chat_generation_observation,
      status: active,
      note: 每轮的 request_id 与首轮开场白；history 迁出后的唯一来源（5a 收缩起不再有 projection_version，展示视图不再解析 history）,
    }
  experience.chat_message_likes:
    { nature: S, owner: rpc:experience.set_chat_message_like, status: active }
  experience.chat_message_overrides:
    { nature: S, owner: backend/src/features/conversations, status: active }
  experience.chat_reply_feedback:
    { nature: E, owner: backend/src/features/chat-feedback, status: active }
  experience.story_memories:
    {
      nature: D,
      owner: backend/src/infrastructure/repositories/StoryMemoryRepository.ts,
      status: active,
    }
  experience.chat_status_snapshots:
    {
      nature: D,
      owner: rpc:experience.record_chat_status,
      status: active,
      note: 状态面板每次更新的结果（每 5 轮自动 / 玩家手动），锚在当前路径的轮次版本上；读经 rpc:experience.get_chat_status，撤销经 rpc:experience.undo_chat_status（20261119_status_bar_v2.sql）,
    }
  experience.chat_memory_snapshots:
    nature: D
    owner: rpc:experience.record_chat_memory
    status: active
    keys:
      memory_snapshot: [version, covered_turn, summary, milestones, records]
    note: 记忆栏每次有变化的检查结果（每 3 轮检查 / 玩家手动，没进展不落库），整份记忆快照 ≤4000 字，键以 shared MemoryBarStateSchema 为准；锚在当前路径的轮次版本上，读经 rpc:experience.get_chat_memory；写入比对读到的那条，不做撤销（20261123_memory_panel.sql）
  experience.story_memory_jobs:
    {
      nature: J,
      owner: backend/src/infrastructure/repositories/StoryMemoryRepository.ts,
      status: active,
      note: 任务表样板,
    }

  # ───────────────────────── media_plaza ─────────────────────────
