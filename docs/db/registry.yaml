          to: billing.usage_charges,
          cols:
            [deduction_rate, llm_intended_deduction, llm_billing_snapshot, llm_billing_settled_at],
          phase: 6,
          note: 计费门禁、交付仲裁、Surplus 结算恢复都读这些列,
