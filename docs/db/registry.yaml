        }
      - {
          to: billing.usage_charges,
          cols: [quote_credits, debit_ledger_id, credits_charged, charged_at],
          phase: 6,
        }

  media_plaza.image_plaza_quotes:
    nature: M
    owner: backend/src/features/image-plaza
    status: moving
    move:
      [{ to: billing.usage_charges, cols: ['*'], phase: 6, note: 报价即 status=quoted 的扣费记录 }]

