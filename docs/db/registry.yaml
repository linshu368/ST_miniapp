      [
        id,
        user_id,
        session_id,
        character_id,
        turn_index,
        revision,
        model,
        user_input,
        assistant_reply,
        status,
        llm_finish_reason,
        created_at,
        postprocess_version,
        choice_rules_mode,
        status_rules_mode,
        memory_rules_mode,
        drive_mode,
        rich_reply_metadata,
