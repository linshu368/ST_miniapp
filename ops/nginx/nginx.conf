# ============================================================================
# ST_miniAPP — nginx 生产网关模板（方案 Y：仅内部分发）
# ----------------------------------------------------------------------------
# 这是 **生产（Railway）模板**。请求来自 Vercel（对外域名绑 Vercel，前端在边缘）；
# Vercel 通过 Next.js rewrites 把 ST 相关路径与 /api/* 转发到本网关，本网关只负责
# 在 ST 与 backend 之间做内部分发：
#   - /tavern[/]            → ST iframe 入口
#   - ST 原生 /api/*        → ST（精确/正则/前缀消歧，下方枚举）
#   - /api/platform/*       → backend（LLM 代理 SSE）
#   - 其余 backend /api/*   → backend
#   - ST 静态资源/根文件    → ST
# 与本地仿真的区别（见同目录 nginx.local.conf）：
#   - 不再代理前端（前端在 Vercel）→ 删除 frontend upstream 与 `location /` 兜底。
#   - 不再暴露 /provision-api/（backend 在 Railway 内网直连 st-bundle:9091）。
#
# ⚠️ 这是 envsubst 模板，不能直接被 nginx 加载：upstream 地址用占位变量
#    ${BACKEND_UPSTREAM} / ${ST_UPSTREAM}，由 ops/nginx/Dockerfile 在容器启动时
#    （nginx 官方 entrypoint 的 20-envsubst-on-templates.sh）替换为 Railway 内网
#    服务名形态（如 stminiapp.railway.internal:8080 / st-bundle.railway.internal:8000）。
#    取值见 ops/env/nginx.env.production.example。
#
# DNS 动态解析：Railway 私有网络 IP 在服务重部署时会变化。nginx 开源版的 upstream
# 块在启动时解析 DNS 并永久缓存，导致上游重部署后连接超时。本配置使用 resolver +
# 变量方式的 proxy_pass，使 nginx 在运行时按 valid 间隔重新解析 DNS。
#
# 硬约束：监听 80、无 SSL（TLS 由 Railway / Vercel 边缘终结）；nginx:1.27-alpine。
# ============================================================================

worker_processes auto;
error_log /dev/stderr warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # JSON-ish 单行访问日志，输出到 stdout（容器友好）。
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    server_tokens   off;
    keepalive_timeout 65;

    # ST 角色卡 / 背景 / 头像上传场景。50m 覆盖角色卡 PNG 与常见背景图。
    client_max_body_size 50m;

    # gzip：文本类资源压缩。承载 SSE 的 location 内显式关闭 gzip（见下），
    # 且 text/event-stream 不在 gzip_types，双保险不破坏流式。
    gzip            on;
    gzip_proxied    any;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_types      text/plain text/css text/xml
                    application/json application/javascript application/xml
                    application/xml+rss image/svg+xml;

    # WebSocket / SSE 通用：upgrade 透传机制（ST 当前不用 ws，保留以备将来）。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # ── Vercel 转发头透传 ────────────────────────────────────────────────────
    # 请求经 Vercel rewrites 进来，Vercel 已带上原始的 X-Forwarded-Proto /
    # X-Forwarded-Host（指向对外域名）。若存在则原样透传给上游，否则回退到本机
    # $scheme / $host。X-Forwarded-For 用 $proxy_add_x_forwarded_for 追加链路 IP。
    # （`~.` = 至少一个字符，即非空时采用入站头。）
    map $http_x_forwarded_proto $fwd_proto {
        default $scheme;
        '~.'    $http_x_forwarded_proto;
    }
    map $http_x_forwarded_host $fwd_host {
        default $host;
        '~.'    $http_x_forwarded_host;
    }

    # ── 全局 proxy 设置（http 级，location 继承）─────────────────────────────
    # proxy_set_header 在 location 级会「整体替换」而非合并，因此统一在 http 级
    # 声明一次，承载 SSE/ws 的 location 只追加 buffering/timeout（不重声明 header）。
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-Host  $fwd_host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # 剥离 ST (helmet) 默认加上的安全头，允许 Vercel 前端 iframe 嵌套
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;

    # ── 上游连接容错 ─────────────────────────────────────────────────────────
    # ST iframe 启动会并发拉数十个 boot 脚本；st-bundle 单容器在偶发 CPU/IO 尖峰下
    # 可能瞬时拒绝连接（ECONNREFUSED），若直接 502 会让整批 boot 脚本失败 → 对话页
    # 卡死。这里在「连接被拒 / 超时」时重试一次（连接阶段尚未发请求体，重试安全）。
    # 注意：未加 non_idempotent，POST（LLM 代理 SSE 等）在请求体已发出后不会被重试，
    # 避免重复上游调用 / 重复扣费；响应头已返回后也不触发（不影响 SSE 长连接）。
    proxy_connect_timeout 5s;
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 8s;

    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name _;

        # ── DNS 动态解析 ──────────────────────────────────────────────────────
        # ⚠️ 不能硬编码 127.0.0.11：那是 **Docker Compose 自带的内嵌 DNS**，仅存在于
        #    docker bridge 网络；Railway 容器内 127.0.0.11:53 无人监听（recv() 111
        #    Connection refused），导致 *.railway.internal 解析超时 → 全部上游 502。
        #    Railway 私有网络的真实 resolver 在 /etc/resolv.conf（实测 `fd12::10`，
        #    **IPv6**），且 *.railway.internal **只有 AAAA 记录** → 必须允许 IPv6 解析
        #    （故移除 ipv6=off）。
        # nginx 官方镜像 entrypoint 的 15-local-resolvers.envsh 会从 /etc/resolv.conf
        #    读取 nameserver 并导出 $NGINX_LOCAL_RESOLVERS（IPv6 已自动加方括号），
        #    随后 20-envsubst 将下方 ${NGINX_LOCAL_RESOLVERS} 替换为真实 resolver。
        #    ⚠️ 该脚本顶部有守卫，必须在 Dockerfile 设 NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1
        #    才会生效（否则此处保持字面量 → nginx [emerg]）。见 ops/nginx/Dockerfile。
        # valid=10s 让 nginx 每 10 秒刷新缓存，防止上游重部署换 IP 后连接超时。
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
        resolver_timeout 5s;

        # 上游地址变量（envsubst 在容器启动时替换 ${…} 占位符）。
        # 使用变量而非 upstream 块，使 proxy_pass 在运行时走 resolver 动态解析。
        set $backend_addr ${BACKEND_UPSTREAM};
        set $st_addr      ${ST_UPSTREAM};

        # nginx 自身健康检查（不依赖任何 upstream；Railway healthcheckPath 命中）
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # ── Layer 1：精确 / 正则消歧（优先级最高）────────────────────────────
        # 注意：方案 Y 下前端 route handler（/api/init-st-session）与对话页
        # /tavern/<UUID> 都由 Vercel 直接处理、不会转发到本网关，故此处不再声明。

        # ST iframe 入口：/tavern、/tavern/ → ST 根 /
        location = /tavern {
            rewrite ^ / break;
            proxy_pass http://$st_addr;
        }
        location = /tavern/ {
            rewrite ^ / break;
            proxy_pass http://$st_addr;
        }

        # backend /api/characters/<UUID>（GET 详情，:id 恒为 UUID）→ backend
        # 注意：/api/characters/ 用普通前缀（非 ^~），保证此正则仍被求值。
        location ~ "^/api/characters/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" {
            proxy_pass http://$backend_addr;
        }

        # ── Layer 2：/api/* 前缀消歧 ─────────────────────────────────────────

        # backend：明确归属 backend 的前缀（^~ 命中后不再查正则，安全且快）
        location ^~ /api/bridge/ {
            # /api/bridge/st/* 可能透传 ST 的 SSE/大文件，关缓冲。
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            gzip off;
            proxy_pass http://$backend_addr;
        }
        location ^~ /api/wallet/   { proxy_pass http://$backend_addr; }
        location ^~ /api/payment/  { proxy_pass http://$backend_addr; }

        # LLM 代理网关（SSE 流式）→ backend，必须关缓冲 + 长超时
        location ^~ /api/platform/ {
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding on;
            gzip off;
            proxy_pass http://$backend_addr;
        }

        # backend 占用的 /api/users/* 精确两条；其余 /api/users/* 归 ST
        location = /api/users/settings { proxy_pass http://$backend_addr; }
        location = /api/users/chats    { proxy_pass http://$backend_addr; }
        location ^~ /api/users/        { proxy_pass http://$st_addr; }

        # backend /api/characters（GET 集合，精确）→ backend
        location = /api/characters     { proxy_pass http://$backend_addr; }

        # ST 浏览器→ST 的 chat-completions（第二段 SSE）→ ST，关缓冲
        location ^~ /api/backends/chat-completions/ {
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            gzip off;
            proxy_pass http://$st_addr;
        }

        # ST 原生 /api/characters/<verb>（all/get/edit…，普通前缀，让上面 UUID 正则先行）
        location /api/characters/ { proxy_pass http://$st_addr; }

        # 其余 /api/* → ST 原生 API 兜底（普通前缀，不屏蔽上面的正则）
        location /api/ { proxy_pass http://$st_addr; }

        # ── Layer 3：ST 静态资源 + 用户数据根路径（事实表 2 真实枚举）→ ST ────
        #
        # 缓存分档（iframe 加载耗时优化 #1）：ST 原生默认给所有静态资源发
        # `Cache-Control: public, max-age=0`，导致每次开对话页 ~200 个 JS/CSS/字体
        # 逐个长途回源（浏览器→Vercel→Railway→ST 共享单容器）。这里在网关按资产
        # 变化频率覆写 Cache-Control：
        #   - ST 原生锁死不可变包（vendor 锁 commit 永不升级）→ 90 天 + immutable
        #   - 自研/第三方扩展 + user.css（随发版/运营变）→ no-cache 保鲜
        #   - 用户数据（角色卡/头像/背景/缩略图/用户文件）→ 不动（保持源站 max-age=0）
        #
        # ⚠️ nginx 头继承两条铁律（改此段务必遵守）：
        #   1. add_header 必带 `always`：默认只对 2xx/3xx 生效，而长缓存最常见的
        #      304 Not Modified 会漏发 → 补丁半失效。
        #   2. 一旦 location 内出现任一 add_header / proxy_hide_header，则 http 级
        #      的同类指令**整体失效（非叠加）**。故每个覆写 location 必须重新声明
        #      要剥离的头（含 http 级原本剥离的 X-Frame-Options / CSP，避免 ST
        #      helmet 头回流；对静态子资源虽无害，仍显式保持全局一致）。
        #   先剥离源站 Cache-Control/Expires/Pragma 再 add_header，否则会出现双
        #   Cache-Control 头（行为未定义）。

        # 【保鲜】自研 st-extension + 第三方扩展：随发版变，缓存旧版=握手坏（等于制造
        # 卡死场景）。third-party 前缀比下方 /scripts/ 更长 → nginx 最长前缀优先命中此处。
        location ^~ /scripts/extensions/third-party/ {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            add_header Cache-Control "no-cache, must-revalidate" always;
            proxy_pass http://$st_addr;
        }
        # 【保鲜】视觉定制通道（ST 中间件从 DATA_ROOT/_css/user.css 动态下发）
        location = /css/user.css {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            add_header Cache-Control "no-cache, must-revalidate" always;
            proxy_pass http://$st_addr;
        }

        # 【长缓存 90d】ST 原生不可变应用包
        location ^~ /scripts/ {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            add_header Cache-Control "public, max-age=7776000, immutable" always;
            proxy_pass http://$st_addr;
        }
        location ^~ /css/ {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            add_header Cache-Control "public, max-age=7776000, immutable" always;
            proxy_pass http://$st_addr;
        }
        location ^~ /lib/ {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            add_header Cache-Control "public, max-age=7776000, immutable" always;
            proxy_pass http://$st_addr;
        }
        location ^~ /webfonts/ {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            add_header Cache-Control "public, max-age=7776000, immutable" always;
            proxy_pass http://$st_addr;
        }
        location ^~ /img/ {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            add_header Cache-Control "public, max-age=7776000, immutable" always;
            proxy_pass http://$st_addr;
        }
        location ^~ /sounds/ {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            add_header Cache-Control "public, max-age=7776000, immutable" always;
            proxy_pass http://$st_addr;
        }
        location ^~ /locales/ {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            add_header Cache-Control "public, max-age=7776000, immutable" always;
            proxy_pass http://$st_addr;
        }
        location ^~ /assets/ {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            add_header Cache-Control "public, max-age=7776000, immutable" always;
            proxy_pass http://$st_addr;
        }

        # 【不动】用户数据根路径：保持源站 Cache-Control（max-age=0），随用户操作保鲜
        location ^~ /backgrounds/ { proxy_pass http://$st_addr; }
        location ^~ /characters/ { proxy_pass http://$st_addr; }
        location ^~ /User%20Avatars/ { proxy_pass http://$st_addr; }
        location ^~ /user/       { proxy_pass http://$st_addr; }   # /user/images/* /user/files/*
        location ^~ /thumbnail/  { proxy_pass http://$st_addr; }

        # ST 根文件
        # 【不动】/csrf-token（安全，绝不缓存）、/version（版本探测）→ 保持源站头
        location = /csrf-token       { proxy_pass http://$st_addr; }
        location = /version          { proxy_pass http://$st_addr; }
        location = /favicon.ico      { proxy_pass http://$st_addr; }
        location = /manifest.json    { proxy_pass http://$st_addr; }
        # 【长缓存 90d】根级应用包 bundle
        location = /style.css {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            add_header Cache-Control "public, max-age=7776000, immutable" always;
            proxy_pass http://$st_addr;
        }
        location = /script.js {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            add_header Cache-Control "public, max-age=7776000, immutable" always;
            proxy_pass http://$st_addr;
        }
        location = /lib.js {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            add_header Cache-Control "public, max-age=7776000, immutable" always;
            proxy_pass http://$st_addr;
        }
        location = /robots.txt       { proxy_pass http://$st_addr; }
        location = /login.html       { proxy_pass http://$st_addr; }
        # ST 多用户登录页：未认证时 ST 会 302 → /login（无 .html），须能转发到 ST，
        # 否则落到下方 `location /` 兜底 404（iframe 内显示 nginx 404 而非登录页）。
        location = /login            { proxy_pass http://$st_addr; }
        location = /st.ico           { proxy_pass http://$st_addr; }
        location = /st-launcher.ico  { proxy_pass http://$st_addr; }

        # ── 兜底：方案 Y 下前端在 Vercel，本网关不该收到 `/` 等前端页面请求。
        #    若误打到这里（探测/配置错误），直接 404，不再代理任何前端。
        location / {
            return 404;
        }
    }
}
