# ============================================================================
# ST_miniAPP — nginx 生产网关模板（方案 Y：仅内部分发）
# ----------------------------------------------------------------------------
# 这是 **生产（Railway）模板**。请求来自 Vercel（对外域名绑 Vercel，前端在边缘）；
# Vercel 通过 Next.js rewrites 把 ST 相关路径与 /api/* 转发到本网关，本网关只负责
# 在 ST 与 backend 之间做内部分发：
#   - /tavern[/]            → ST iframe 入口
#   - ST 原生 /api/*        → ST（精确/正则/前缀消歧，下方枚举）
#   - /api/platform/*       → backend（LLM 代理 SSE）
#   - 其余 backend /api/*   → backend
#   - ST 静态资源/根文件    → ST
# 与本地仿真的区别（见同目录 nginx.local.conf）：
#   - 不再代理前端（前端在 Vercel）→ 删除 frontend upstream 与 `location /` 兜底。
#   - 不再暴露 /provision-api/（backend 在 Railway 内网直连 st-bundle:9091）。
#
# ⚠️ 这是 envsubst 模板，不能直接被 nginx 加载：upstream 地址用占位变量
#    ${BACKEND_UPSTREAM} / ${ST_UPSTREAM}，由 ops/nginx/Dockerfile 在容器启动时
#    （nginx 官方 entrypoint 的 20-envsubst-on-templates.sh）替换为 Railway 内网
#    服务名形态（如 backend.railway.internal:3001 / st-bundle.railway.internal:8000）。
#    取值见 ops/env/nginx.env.production.example。
#
# 硬约束：监听 80、无 SSL（TLS 由 Railway / Vercel 边缘终结）；nginx:1.27-alpine。
# ============================================================================

worker_processes auto;
error_log /dev/stderr warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # JSON-ish 单行访问日志，输出到 stdout（容器友好）。
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    server_tokens   off;
    keepalive_timeout 65;

    # ST 角色卡 / 背景 / 头像上传场景。50m 覆盖角色卡 PNG 与常见背景图。
    client_max_body_size 50m;

    # gzip：文本类资源压缩。承载 SSE 的 location 内显式关闭 gzip（见下），
    # 且 text/event-stream 不在 gzip_types，双保险不破坏流式。
    gzip            on;
    gzip_proxied    any;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_types      text/plain text/css text/xml
                    application/json application/javascript application/xml
                    application/xml+rss image/svg+xml;

    # WebSocket / SSE 通用：upgrade 透传机制（ST 当前不用 ws，保留以备将来）。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # ── Vercel 转发头透传 ────────────────────────────────────────────────────
    # 请求经 Vercel rewrites 进来，Vercel 已带上原始的 X-Forwarded-Proto /
    # X-Forwarded-Host（指向对外域名）。若存在则原样透传给上游，否则回退到本机
    # $scheme / $host。X-Forwarded-For 用 $proxy_add_x_forwarded_for 追加链路 IP。
    # （`~.` = 至少一个字符，即非空时采用入站头。）
    map $http_x_forwarded_proto $fwd_proto {
        default $scheme;
        '~.'    $http_x_forwarded_proto;
    }
    map $http_x_forwarded_host $fwd_host {
        default $host;
        '~.'    $http_x_forwarded_host;
    }

    # ── 全局 proxy 设置（http 级，location 继承）─────────────────────────────
    # proxy_set_header 在 location 级会「整体替换」而非合并，因此统一在 http 级
    # 声明一次，承载 SSE/ws 的 location 只追加 buffering/timeout（不重声明 header）。
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-Host  $fwd_host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # 剥离 ST (helmet) 默认加上的安全头，允许 Vercel 前端 iframe 嵌套
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;

    # ── upstreams（Railway 内网服务名；启动时由 envsubst 注入）────────────────
    # 生产网关只分发到 backend 与 ST 两个上游；前端在 Vercel，不在此处代理。
    upstream backend { server ${BACKEND_UPSTREAM}; }
    upstream st      { server ${ST_UPSTREAM}; }

    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name _;

        # nginx 自身健康检查（不依赖任何 upstream；Railway healthcheckPath 命中）
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # ── Layer 1：精确 / 正则消歧（优先级最高）────────────────────────────
        # 注意：方案 Y 下前端 route handler（/api/init-st-session）与对话页
        # /tavern/<UUID> 都由 Vercel 直接处理、不会转发到本网关，故此处不再声明。

        # ST iframe 入口：/tavern、/tavern/ → ST 根 /
        location = /tavern {
            proxy_pass http://st/;
        }
        location = /tavern/ {
            proxy_pass http://st/;
        }

        # backend /api/characters/<UUID>（GET 详情，:id 恒为 UUID）→ backend
        # 注意：/api/characters/ 用普通前缀（非 ^~），保证此正则仍被求值。
        location ~ "^/api/characters/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" {
            proxy_pass http://backend;
        }

        # ── Layer 2：/api/* 前缀消歧 ─────────────────────────────────────────

        # backend：明确归属 backend 的前缀（^~ 命中后不再查正则，安全且快）
        location ^~ /api/bridge/ {
            # /api/bridge/st/* 可能透传 ST 的 SSE/大文件，关缓冲。
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            gzip off;
            proxy_pass http://backend;
        }
        location ^~ /api/wallet/   { proxy_pass http://backend; }
        location ^~ /api/payment/  { proxy_pass http://backend; }

        # LLM 代理网关（SSE 流式）→ backend，必须关缓冲 + 长超时
        location ^~ /api/platform/ {
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding on;
            gzip off;
            proxy_pass http://backend;
        }

        # backend 占用的 /api/users/* 精确两条；其余 /api/users/* 归 ST
        location = /api/users/settings { proxy_pass http://backend; }
        location = /api/users/chats    { proxy_pass http://backend; }
        location ^~ /api/users/        { proxy_pass http://st; }

        # backend /api/characters（GET 集合，精确）→ backend
        location = /api/characters     { proxy_pass http://backend; }

        # ST 浏览器→ST 的 chat-completions（第二段 SSE）→ ST，关缓冲
        location ^~ /api/backends/chat-completions/ {
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            gzip off;
            proxy_pass http://st;
        }

        # ST 原生 /api/characters/<verb>（all/get/edit…，普通前缀，让上面 UUID 正则先行）
        location /api/characters/ { proxy_pass http://st; }

        # 其余 /api/* → ST 原生 API 兜底（普通前缀，不屏蔽上面的正则）
        location /api/ { proxy_pass http://st; }

        # ── Layer 3：ST 静态资源 + 用户数据根路径（事实表 2 真实枚举）→ ST ────
        location ^~ /scripts/    { proxy_pass http://st; }
        location ^~ /css/        { proxy_pass http://st; }
        location ^~ /img/        { proxy_pass http://st; }
        location ^~ /lib/        { proxy_pass http://st; }
        location ^~ /locales/    { proxy_pass http://st; }
        location ^~ /sounds/     { proxy_pass http://st; }
        location ^~ /webfonts/   { proxy_pass http://st; }
        location ^~ /backgrounds/ { proxy_pass http://st; }
        location ^~ /characters/ { proxy_pass http://st; }
        location ^~ /User%20Avatars/ { proxy_pass http://st; }
        location ^~ /assets/     { proxy_pass http://st; }
        location ^~ /user/       { proxy_pass http://st; }   # /user/images/* /user/files/*
        location ^~ /thumbnail/  { proxy_pass http://st; }

        # ST 根文件
        location = /csrf-token       { proxy_pass http://st; }
        location = /version          { proxy_pass http://st; }
        location = /favicon.ico      { proxy_pass http://st; }
        location = /manifest.json    { proxy_pass http://st; }
        location = /style.css        { proxy_pass http://st; }
        location = /script.js        { proxy_pass http://st; }
        location = /lib.js           { proxy_pass http://st; }
        location = /robots.txt       { proxy_pass http://st; }
        location = /login.html       { proxy_pass http://st; }
        location = /st.ico           { proxy_pass http://st; }
        location = /st-launcher.ico  { proxy_pass http://st; }

        # ── 兜底：方案 Y 下前端在 Vercel，本网关不该收到 `/` 等前端页面请求。
        #    若误打到这里（探测/配置错误），直接 404，不再代理任何前端。
        location / {
            return 404;
        }
    }
}
