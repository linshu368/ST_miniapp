# ============================================================================
# ST_miniAPP — nginx 网关配置（本地 / staging 全栈仿真专用）
# ----------------------------------------------------------------------------
# ⚠️ 这是「本地 docker compose 全栈仿真」用的完整网关配置，**不是生产配置**。
#    - 生产（方案 Y）：对外域名绑 Vercel，前端在 Vercel；Railway nginx 退化为
#      仅做 ST 与 backend 的内部分发，见同目录 `nginx.conf`（生产模板）。
#    - 本文件保留 frontend 上游、`location /` 兜底与 `/provision-api/` 暴露，
#      因为本地 compose 把前端页面、provision-api 也一并跑在同一网关后面，
#      用于离线复现整套 MVP 流程（docker-compose.yml bind-mount 本文件）。
#
# 端口约定（upstream，docker compose network 内 hostname）：
#   frontend     frontend:3000     Next.js standalone（本地自托管容器；生产在 Vercel）
#   backend      backend:3001      Fastify 平台 API（源自 config.ts: PORT||3001）
#   st-backend   st-backend:8000   SillyTavern 主体
#   st-backend   st-backend:9091   provision-api（同 st-bundle 容器副进程）
#                                   ⚠️ provision-api 无鉴权；compose 注入
#                                      PROVISION_API_BIND_HOST=0.0.0.0 仅供本地内网。
# ============================================================================

worker_processes auto;
error_log /dev/stderr warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # JSON-ish 单行访问日志，输出到 stdout（容器友好）。
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    server_tokens   off;
    keepalive_timeout 65;

    # ST 角色卡 / 背景 / 头像上传场景。取值依据：ST 默认允许大文件上传，
    # 50m 覆盖角色卡 PNG 与常见背景图；如遇更大素材可上调并在此注明。
    client_max_body_size 50m;

    # gzip：文本类资源压缩。proxied 响应也压缩，但承载 SSE 的 location 内显式
    # 关闭 gzip（见下），且 text/event-stream 不在 gzip_types，双保险不破坏流式。
    gzip            on;
    gzip_proxied    any;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_types      text/plain text/css text/xml
                    application/json application/javascript application/xml
                    application/xml+rss image/svg+xml;

    # WebSocket / SSE 通用：
    #   - $http_upgrade 非空（websocket）→ Connection: upgrade
    #   - 空（普通请求 / SSE）           → Connection: ''（不转发 keepalive）
    # ST 当前不使用 WebSocket（vendor 无 ws.Server / socket.io），但保留该机制，
    # 未来 ST/前端引入 ws 时无需改动。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # ── 全局 proxy 设置（http 级，location 继承）─────────────────────────────
    # proxy_set_header 在 location 级会「整体替换」而非合并，因此统一在 http 级
    # 声明一次，承载 SSE/ws 的 location 只追加 buffering/timeout（不重声明 header）。
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # 剥离 ST (helmet) 默认加上的安全头，允许 Vercel 前端 iframe 嵌套
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;

    # ── upstreams（docker compose network hostname）──────────────────────────
    upstream frontend   { server frontend:3000; }
    upstream backend    { server backend:3001;  }
    upstream st         { server st-backend:8000; }
    upstream provision  { server st-backend:9091; }

    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name _;

        # nginx 自身健康检查
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # ── Layer 1：精确 / 正则消歧（优先级最高）────────────────────────────

        # 前端 route handler（/api/* 三方共享中的前端一方），必须先于 /api/ 截胡
        location = /api/init-st-session {
            proxy_pass http://frontend;
        }

        # ST iframe 入口：/tavern、/tavern/ → ST 根 /
        location = /tavern {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            add_header Cache-Control "private, no-store, must-revalidate" always;
            proxy_pass http://st/;
        }
        location = /tavern/ {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            add_header Cache-Control "private, no-store, must-revalidate" always;
            proxy_pass http://st/;
        }

        # 对话页 /tavern/<UUID> → 前端动态路由（characterId 恒为 UUID）
        # 正则含 {n} 量词，必须整体加引号，否则 nginx 把 { 当作 block 起始。
        location ~ "^/tavern/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/?$" {
            proxy_pass http://frontend;
        }

        # backend /api/characters/<UUID>（GET 详情，:id 恒为 UUID）→ backend
        # 注意：/api/characters/ 用普通前缀（非 ^~），保证此正则仍被求值。
        location ~ "^/api/characters/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" {
            proxy_pass http://backend;
        }

        # ── 发布级资产命名空间（与生产 nginx.conf 对齐，本地 base 通常为 "/"，
        #    该规则仅在镜像仿真时生效）────────────────────────────────────────
        location ~ ^/st-runtime/[^/]+/(.+)$ {
            rewrite ^/st-runtime/[^/]+/(.+)$ /$1 last;
        }

        # ── Layer 2：/api/* 前缀消歧 ─────────────────────────────────────────

        # backend：明确归属 backend 的前缀（^~ 命中后不再查正则，安全且快）
        location ^~ /api/bridge/ {
            # /api/bridge/st/* 可能透传 ST 的 SSE/大文件，关缓冲。
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            gzip off;
            proxy_pass http://backend;
        }
        location ^~ /api/wallet/   { proxy_pass http://backend; }
        location ^~ /api/payment/  { proxy_pass http://backend; }

        # LLM 代理网关（SSE 流式）→ backend，必须关缓冲 + 长超时
        location ^~ /api/platform/ {
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding on;
            gzip off;
            proxy_pass http://backend;
        }

        # backend 占用的 /api/users/* 精确两条；其余 /api/users/* 归 ST
        location = /api/users/settings { proxy_pass http://backend; }
        location = /api/users/chats    { proxy_pass http://backend; }
        location ^~ /api/users/        { proxy_pass http://st; }

        # backend /api/characters（GET 集合，精确）→ backend
        location = /api/characters     { proxy_pass http://backend; }

        # ST 浏览器→ST 的 chat-completions（第二段 SSE）→ ST，关缓冲
        location ^~ /api/backends/chat-completions/ {
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            gzip off;
            proxy_pass http://st;
        }

        # ST 原生 /api/characters/<verb>（all/get/edit…，普通前缀，让上面 UUID 正则先行）
        location /api/characters/ { proxy_pass http://st; }

        # 其余 /api/* → ST 原生 API 兜底（普通前缀，不屏蔽上面的正则）
        location /api/ { proxy_pass http://st; }

        # ── provision-api（M1 确认 9091；strip /provision-api/ 前缀）──────────
        # ⚠️ 安全：provision-api 无鉴权、设计上仅供 backend 内网调用。
        #         仅本地仿真暴露；生产由 backend 经 Railway 内网直连，不经过 nginx。
        location ^~ /provision-api/ {
            proxy_pass http://provision/;   # 末尾 / → 剥离 /provision-api/ 前缀
        }

        # ── Layer 3：ST 静态资源 + 用户数据根路径（事实表 2 真实枚举）→ ST ────
        #
        # 缓存分档（iframe 加载耗时优化 #1，与生产 nginx.conf 保持一致）：
        #   - ST 原生锁死不可变包 → 90 天 + immutable
        #   - 自研/第三方扩展 + user.css → no-cache 保鲜
        #   - 用户数据（角色卡/头像/背景/缩略图/用户文件）→ 不动（源站 max-age=0）
        # nginx 头继承铁律：add_header 必带 always（304 也发头）；location 内一旦出现
        # add_header/proxy_hide_header，http 级同类指令整体失效，故每个覆写 location
        # 必须重声明要剥离的头（含 X-Frame-Options / CSP）；先剥离源站 Cache-Control
        # 再 add_header，避免双头。

        # 【长缓存 30d】酒馆助手（与 nginx.conf 生产配置对齐，见彼处注释）
        location ^~ /scripts/extensions/third-party/JS-Slash-Runner/ {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            proxy_hide_header Set-Cookie;
            add_header Cache-Control "public, max-age=2592000, s-maxage=2592000" always;
            proxy_pass http://st;
        }

        # 【保鲜】自研 st-extension + 其余第三方扩展（最长前缀优先命中，先于 /scripts/）
        location ^~ /scripts/extensions/third-party/ {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            add_header Cache-Control "no-cache, must-revalidate" always;
            proxy_pass http://st;
        }
        # 【保鲜】视觉定制通道（DATA_ROOT/_css/user.css 动态下发）
        location = /css/user.css {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            add_header Cache-Control "no-cache, must-revalidate" always;
            proxy_pass http://st;
        }

        # 【保鲜】MiniApp 会直接打补丁的 ST 模块入口。
        location = /scripts/extensions.js {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            proxy_hide_header Set-Cookie;
            add_header Cache-Control "no-cache, must-revalidate" always;
            proxy_pass http://st;
        }
        # 【保鲜】MiniApp bridge 依赖的受控 ST context 会随本地补丁演进，
        # 不可落入下方 90 天 immutable 档。
        location = /scripts/st-context.js {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            proxy_hide_header Set-Cookie;
            add_header Cache-Control "no-cache, must-revalidate" always;
            proxy_pass http://st;
        }

        # 【长缓存 90d】ST 原生不可变应用包
        location ^~ /scripts/ {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            proxy_hide_header Set-Cookie;
            add_header Cache-Control "public, max-age=7776000, s-maxage=7776000, immutable" always;
            proxy_pass http://st;
        }
        location ^~ /css/ {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            proxy_hide_header Set-Cookie;
            add_header Cache-Control "public, max-age=7776000, s-maxage=7776000, immutable" always;
            proxy_pass http://st;
        }
        location ^~ /lib/ {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            proxy_hide_header Set-Cookie;
            add_header Cache-Control "public, max-age=7776000, s-maxage=7776000, immutable" always;
            proxy_pass http://st;
        }
        location ^~ /webfonts/ {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            proxy_hide_header Set-Cookie;
            add_header Cache-Control "public, max-age=7776000, s-maxage=7776000, immutable" always;
            proxy_pass http://st;
        }
        location ^~ /img/ {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            proxy_hide_header Set-Cookie;
            add_header Cache-Control "public, max-age=7776000, s-maxage=7776000, immutable" always;
            proxy_pass http://st;
        }
        location ^~ /sounds/ {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            proxy_hide_header Set-Cookie;
            add_header Cache-Control "public, max-age=7776000, s-maxage=7776000, immutable" always;
            proxy_pass http://st;
        }
        location ^~ /locales/ {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            proxy_hide_header Set-Cookie;
            add_header Cache-Control "public, max-age=7776000, s-maxage=7776000, immutable" always;
            proxy_pass http://st;
        }
        # 【不动】用户数据根路径：保持源站 Cache-Control（max-age=0）
        location ^~ /assets/     { proxy_pass http://st; }
        location ^~ /backgrounds/ { proxy_pass http://st; }
        location ^~ /characters/ { proxy_pass http://st; }
        location ^~ /User%20Avatars/ { proxy_pass http://st; }
        location ^~ /user/       { proxy_pass http://st; }   # /user/images/* /user/files/*
        location ^~ /thumbnail/  { proxy_pass http://st; }

        # ST 根文件
        # 【不动】/csrf-token（安全）、/version（版本探测）→ 保持源站头
        location = /csrf-token       { proxy_pass http://st; }
        location = /version          { proxy_pass http://st; }
        location = /favicon.ico      { proxy_pass http://st; }
        location = /manifest.json    { proxy_pass http://st; }
        # 【长缓存 90d】根级应用包 bundle
        location = /style.css {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            proxy_hide_header Set-Cookie;
            add_header Cache-Control "public, max-age=7776000, s-maxage=7776000, immutable" always;
            proxy_pass http://st;
        }
        location = /script.js {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            proxy_hide_header Set-Cookie;
            add_header Cache-Control "no-cache, must-revalidate" always;
            proxy_pass http://st;
        }
        location = /lib.js {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            proxy_hide_header Set-Cookie;
            add_header Cache-Control "public, max-age=7776000, s-maxage=7776000, immutable" always;
            proxy_pass http://st;
        }
        location = /robots.txt       { proxy_pass http://st; }
        location = /login.html {
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            add_header Cache-Control "private, no-store, must-revalidate" always;
            proxy_pass http://st;
        }
        location = /st.ico           { proxy_pass http://st; }
        location = /st-launcher.ico  { proxy_pass http://st; }

        # ── Layer 4：兜底 → 前端（/、/create、/profile/*、/_next/* 等所有前端页面）
        location / {
            proxy_pass http://frontend;
        }
    }
}
