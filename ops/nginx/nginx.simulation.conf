worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - - [$time_local] "$request" '
                    '$status $body_bytes_sent rt=$request_time';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
        resolver_timeout 5s;
        set $st_addr ${ST_UPSTREAM};

        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # The production ST image versions its browser assets under
        # /st-runtime/<build>/. Strip that namespace before forwarding to ST.
        location ~ ^/st-runtime/[^/]+/(.+)$ {
            rewrite ^/st-runtime/[^/]+/(.+)$ /$1 last;
        }

        # This gateway is private and dedicated to the headless simulation
        # browser, so every remaining ST page/API request goes to SillyTavern.
        location / {
            proxy_pass http://$st_addr;
        }
    }
}
