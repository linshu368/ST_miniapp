<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>正在打开支付</title>
    <!--
      Mini App 跑在 Telegram 的 WebView 里，WebView 分发不了 weixin:// / alipays:// 这类
      自定义协议，导航过去只会得到 ERR_UNKNOWN_URL_SCHEME（端上显示「无法加载」）。
      openLink 打开的是真正的浏览器，浏览器才有能力把协议交给系统，
      所以支付唤起必须先经过这个静态中转页。这里刻意不引任何框架和 SDK：
      唤起要紧跟页面加载，多一个字节的依赖都是多一分失败概率。
    -->
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: #f7f8fa;
        color: #1f2329;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #17171a;
          color: #e8e8ea;
        }
      }
      main {
        text-align: center;
        padding: 32px 24px;
        max-width: 320px;
      }
      .spinner {
        width: 34px;
        height: 34px;
        margin: 0 auto 20px;
        border: 3px solid rgba(22, 119, 255, 0.2);
        border-top-color: #1677ff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .hint {
        font-size: 16px;
        margin: 0 0 24px;
      }
      .btn {
        display: inline-block;
        padding: 12px 28px;
        border-radius: 999px;
        background: #1677ff;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
      }
      .sub {
        margin: 16px 0 0;
        font-size: 13px;
        opacity: 0.55;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="spinner" id="spinner"></div>
      <p class="hint" id="hint">正在打开支付…</p>
      <a class="btn" id="launch" hidden>继续支付</a>
      <p class="sub" id="sub" hidden>如果没有自动跳转，请点击上面的按钮</p>
    </main>
    <script>
      (function () {
        // 只允许唤起支付类 App，避免这个页面变成任意协议的开放跳板
        var APPS = {
          'alipays:': { pkg: 'com.eg.android.AlipayGphone', label: '支付宝' },
          'alipay:': { pkg: 'com.eg.android.AlipayGphone', label: '支付宝' },
          'weixin:': { pkg: 'com.tencent.mm', label: '微信' },
        };

        var params = new URLSearchParams(location.search);
        var scheme = params.get('scheme') || '';
        var fallback = params.get('fallback') || '';
        if (!/^https?:\/\//i.test(fallback)) fallback = '';

        var hint = document.getElementById('hint');
        var sub = document.getElementById('sub');
        var link = document.getElementById('launch');
        var spinner = document.getElementById('spinner');

        var matched = scheme.match(/^([a-z][a-z0-9+.-]*:)\/\//i);
        var proto = matched ? matched[1].toLowerCase() : '';
        var app = APPS[proto];

        // 这里不拿 fallback 做兜底跳转：那会让本页变成任意 http(s) 的开放重定向，
        // 可被用作钓鱼跳板。fallback 只交给 intent 的 browser_fallback_url。
        if (!app) {
          spinner.hidden = true;
          hint.textContent = '支付链接无效，请返回重新下单';
          return;
        }

        hint.textContent = '正在打开' + app.label + '…';
        link.textContent = '打开' + app.label;

        // Android 的 WebView / Chrome 对 intent:// 有原生支持，比裸协议可靠；
        // 且能带 browser_fallback_url，未装 App 时自动落回收银台而不是报错页。
        var target = scheme;
        if (/android/i.test(navigator.userAgent)) {
          var rest = scheme.slice(proto.length + 2);
          target =
            'intent://' +
            rest +
            '#Intent;scheme=' +
            proto.slice(0, -1) +
            ';package=' +
            app.pkg +
            (fallback ? ';S.browser_fallback_url=' + encodeURIComponent(fallback) : '') +
            ';end';
        }

        link.href = target;
        link.hidden = false;
        sub.hidden = false;

        location.replace(target);
      })();
    </script>
  </body>
</html>
